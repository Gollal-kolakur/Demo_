name: Run Python Playwright Tests in Docker

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # ಗಿಟ್‌ಹಬ್‌ನ ಕ್ಲೌಡ್ ಒಳಗಡೆ ಈ ಡಾಕರ್ ಕಂಟೇನರ್ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ರನ್ ಆಗುತ್ತದೆ
    container:
      image: ://microsoft.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-playwright

    - name: Run pytest
      env:
        PYTHONPATH: .
      run: |
        pytest
