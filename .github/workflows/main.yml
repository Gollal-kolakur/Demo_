name: Run Python Playwright Tests with Allure Report

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    container:
      image: ://microsoft.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-playwright allure-pytest

    - name: Run pytest with Allure
      env:
        PYTHONPATH: .
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true # ಟೆಸ್ಟ್ ಫೇಲ್ ಆದರೂ ರಿಪೋರ್ಟ್ ಜನರೇಟ್ ಆಗಲು ಇದು ಮುಖ್ಯ

    # ಕಂಟೇನರ್ ಒಳಗೆ ಜಾವಾ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡುತ್ತದೆ (ಅಲ್ಯೂರ್ ಜನರೇಟ್ ಮಾಡಲು ಜಾವಾ ಬೇಕು)
    - name: Install Java
      run: |
        apt-get update && apt-get install -y openjdk-17-jre-headless

    # ಇದು ಅಲ್ಯೂರ್ ರಿಪೋರ್ಟ್ ಜನರೇಟ್ ಮಾಡಿ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ gh-pages ಬ್ರಾಂಚ್‌ಗೆ ಪಬ್ಲಿಷ್ ಮಾಡುತ್ತದೆ
    - name: Load Allure History and Publish Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20
        gh_pages: gh-pages
        allure_report: allure-report

    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
