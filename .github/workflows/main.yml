name: Run Python Playwright Tests with Allure Report

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# ಈ ಕೆಳಗಿನ ಪರ್ಮಿಷನ್ ಬ್ಲಾಕ್ 403 ದೋಷವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ನಿವಾರಿಸುತ್ತದೆ
permissions:
  contents: write
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-playwright allure-pytest

    - name: Install Playwright Browsers with Dependencies
      run: |
        playwright install --with-deps

    - name: Run pytest with Allure
      env:
        PYTHONPATH: .
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true

    - name: Run Allure Action to Generate Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20
        gh_pages: gh-pages
        allure_report: allure-report

    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
