name: Demo web application QA RUN

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'qa'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging

      browser:
        description: 'chromium'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

permissions:
  contents: write

jobs:
  regression-test:
    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright allure-pytest python-dotenv

      - name: Install Playwright Browsers
        run: playwright install --with-deps

      - name: Run pytest with Allure
        env:
          PYTHONPATH: .
          base_url: ${{ secrets.BASE_URL }}
          user_name: ${{ secrets.USER_NAME }}
          password: ${{ secrets.PASSWORD }}
        run: |
          pytest \
            --browsername=${{ github.event.inputs.browser }} \
            --env=${{ github.event.inputs.environment }} \
            --alluredir=allure-results \
            -n auto
        continue-on-error: true

      ####################################################################
      # DEBUG 1
      ####################################################################
      - name: Debug Allure Results Folder
        if: always()
        run: |
          echo "========== allure-results =========="
          pwd
          ls -lah
          echo ""
          ls -lah allure-results || true
          echo ""
          echo "JSON Files"
          find allure-results -type f || true
          echo ""
          echo "Result Files Count"
          find allure-results -name "*-result.json" | wc -l

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          keep_reports: 3

      ####################################################################
      # DEBUG 2
      ####################################################################
      - name: Debug Generated Report
        if: always()
        run: |
          echo "========== allure-report =========="
          ls -lah allure-report || true
          echo ""
          echo "Folder Structure"
          find allure-report -maxdepth 3
          echo ""
          echo "Checking data folder"
          ls -lah allure-report/data || true
          echo ""
          echo "Checking test-cases"
          ls -lah allure-report/data/test-cases || true
          echo ""
          echo "Checking widgets"
          ls -lah allure-report/widgets || true

      ####################################################################
            ####################################################################
      # DEBUG 3 - Inspect Allure Data
      ####################################################################
      - name: Inspect Allure Data
        if: always()
        run: |
          echo "========== ALLURE DATA =========="

          echo ""
          echo "===== data folder ====="
          find allure-report/data -maxdepth 2 -type f || true

          echo ""
          echo "===== test-cases folder ====="
          ls -lah allure-report/data/test-cases || true

          echo ""
          echo "===== summary.json ====="
          cat allure-report/widgets/summary.json || true

          echo ""
          echo "===== suites.json ====="
          cat allure-report/widgets/suites.json || true

          echo ""
          echo "===== categories.json ====="
          cat allure-report/widgets/categories.json || true
