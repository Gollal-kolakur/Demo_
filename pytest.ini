[pytest]

# Default CLI flags
addopts =
    -v

    --tb=short
    --browsername=chromium
    --html=reports/report.html
    --self-contained-html

# Discover tests only in the tests/ directory

testpaths = tests

# Mark definitions ()
markers =
    smoke:       Smoke / sanity tests (run on every build)
    regression:  Full regression suite
    security:    Security-related test cases
    negative:    Negative / sad-path test cases



